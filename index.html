<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Obra · HM</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #0c0e12;
  --surface: #111318;
  --raised:  #161920;
  --border:  #1d2130;
  --border2: #252a3a;
  --accent:  #4f7cff;
  --adim:    rgba(79,124,255,.12);
  --green:   #2dd898;
  --gdim:    rgba(45,216,152,.12);
  --amber:   #e8a234;
  --red:     #f05252;
  --text:    #d8dce8;
  --text2:   #9ca3b4;
  --text3:   #5a6380;
  --mono:    'DM Mono', monospace;
  --serif:   'Fraunces', serif;
  --sans:    'Instrument Sans', sans-serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* ── LOGIN ── */
#view-login {
  display: flex; align-items: center; justify-content: center;
  min-height: 100vh; padding: 2rem;
  background: radial-gradient(ellipse 60% 50% at 50% 0%, rgba(79,124,255,.07) 0%, transparent 70%);
}
.login-wrap { width: 100%; max-width: 320px; }
.login-eyebrow { font-family: var(--mono); font-size: .62rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text3); margin-bottom: 1.75rem; }
.login-title { font-family: var(--serif); font-size: 2.2rem; font-weight: 300; line-height: 1.15; margin-bottom: .4rem; }
.login-title em { font-style: italic; color: var(--accent); }
.login-sub { font-size: .8rem; color: var(--text3); margin-bottom: 2rem; }
.f { margin-bottom: .9rem; }
.f label { display: block; font-size: .65rem; font-family: var(--mono); color: var(--text3); text-transform: uppercase; letter-spacing: .1em; margin-bottom: .35rem; }
.f input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: .85rem; padding: .6rem .9rem; border-radius: 6px; outline: none; transition: border-color .15s; }
.f input:focus { border-color: var(--accent); }
.btn-login { width: 100%; margin-top: .25rem; padding: .7rem; background: var(--accent); color: #fff; border: none; border-radius: 6px; font-family: var(--sans); font-size: .85rem; font-weight: 600; cursor: pointer; transition: opacity .15s; }
.btn-login:hover { opacity: .85; }
#login-err { font-size: .72rem; color: var(--red); text-align: center; margin-top: .6rem; min-height: 1rem; }

/* ── APP ── */
#view-app { display: none; min-height: 100vh; flex-direction: column; }

/* ── TOPBAR ── */
.topbar { display: flex; align-items: center; gap: 1rem; padding: 0 1.5rem; height: 52px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50; }
.topbar-logo { font-family: var(--mono); font-size: .65rem; letter-spacing: .18em; text-transform: uppercase; color: var(--text3); }
.topbar-logo b { color: var(--accent); font-weight: 500; }
.topbar-actions { margin-left: auto; display: flex; gap: .5rem; align-items: center; }
.topbar-user { font-family: var(--mono); font-size: .7rem; color: var(--text3); }

/* ── BUTTONS ── */
.btn { padding: .4rem .85rem; border-radius: 5px; border: none; font-family: var(--sans); font-size: .78rem; font-weight: 600; cursor: pointer; transition: all .15s; display: inline-flex; align-items: center; gap: .35rem; }
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #3d6aff; }
.btn-ghost { background: transparent; color: var(--text2); border: 1px solid var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--border2); }
.btn-sm { padding: .3rem .65rem; font-size: .72rem; }

/* ── HERO ── */
.hero { padding: 3rem 1.5rem 2rem; }
.hero-title { font-family: var(--serif); font-size: 1.75rem; font-weight: 300; margin-bottom: .4rem; }
.hero-title em { font-style: italic; color: var(--accent); }
.hero-sub { font-size: .82rem; color: var(--text3); }

/* ── TOOLBAR ── */
.toolbar { display: flex; align-items: center; gap: .75rem; padding: 0 1.5rem 1.25rem; flex-wrap: wrap; }
.search-wrap { position: relative; flex: 1; min-width: 180px; max-width: 320px; }
.search-wrap input { width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--mono); font-size: .78rem; padding: .45rem .75rem .45rem 2rem; border-radius: 6px; outline: none; transition: border-color .15s; }
.search-wrap input:focus { border-color: var(--accent); }
.search-icon { position: absolute; left: .6rem; top: 50%; transform: translateY(-50%); color: var(--text3); pointer-events: none; }
.filter-btns { display: flex; gap: .3rem; }
.filter-btn { padding: .35rem .7rem; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--text3); font-size: .72rem; font-family: var(--mono); cursor: pointer; transition: all .15s; }
.filter-btn.active { border-color: var(--accent); color: var(--accent); background: var(--adim); }
.obras-count { font-family: var(--mono); font-size: .7rem; color: var(--text3); margin-left: auto; }

/* ── GRID ── */
.obras-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 0 1.5rem 3rem; }

/* ── CARD ── */
.obra-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .2s, transform .2s, box-shadow .2s; }
.obra-card:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,.3); }
.card-thumb { height: 160px; background: var(--raised); position: relative; overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.card-thumb img { width: 100%; height: 100%; object-fit: cover; filter: invert(1) brightness(.8) contrast(1.05); }
.card-thumb-empty { color: var(--text3); font-size: 2.5rem; opacity: .15; }
.card-estado { position: absolute; top: .6rem; right: .6rem; font-family: var(--mono); font-size: .58rem; text-transform: uppercase; letter-spacing: .08em; padding: .2rem .5rem; border-radius: 20px; }
.card-estado.em_obra   { background: rgba(232,162,52,.15); color: var(--amber); border: 1px solid rgba(232,162,52,.3); }
.card-estado.concluido { background: var(--gdim); color: var(--green); border: 1px solid rgba(45,216,152,.3); }
.card-body { padding: .85rem 1rem; flex: 1; display: flex; flex-direction: column; gap: .3rem; }
.card-nome { font-size: .92rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-id { font-family: var(--mono); font-size: .65rem; color: var(--text3); }
.card-morada { font-size: .72rem; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-stats { display: flex; gap: .75rem; margin-top: auto; padding-top: .5rem; border-top: 1px solid var(--border); }
.card-stat { font-family: var(--mono); font-size: .65rem; color: var(--text3); }
.card-stat b { color: var(--text2); }
.card-actions { display: flex; gap: .4rem; padding: .65rem 1rem; border-top: 1px solid var(--border); background: var(--raised); }
.card-btn { flex: 1; padding: .35rem .25rem; border-radius: 5px; border: 1px solid var(--border); background: transparent; color: var(--text2); font-size: .68rem; font-family: var(--sans); font-weight: 600; cursor: pointer; transition: all .15s; text-align: center; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: .25rem; }
.card-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--adim); }
.card-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.card-btn.primary:hover { background: #3d6aff; }

/* ── EMPTY ── */
.empty-state { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; padding: 5rem 2rem; gap: 1rem; color: var(--text3); text-align: center; }
.empty-icon { font-size: 3rem; opacity: .2; }
.empty-title { font-size: 1rem; font-weight: 600; color: var(--text2); }
.empty-sub { font-size: .82rem; line-height: 1.6; max-width: 280px; }

/* ── LOADING ── */
.loading-grid { grid-column: 1/-1; display: flex; justify-content: center; padding: 4rem; }
.spinner { width: 24px; height: 24px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── MODAL ── */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 200; align-items: center; justify-content: center; padding: 1rem; }
.modal-bg.open { display: flex; }
.modal { background: var(--surface); border: 1px solid var(--border2); border-radius: 10px; padding: 1.5rem; width: 100%; max-width: 380px; }
.modal-title { font-family: var(--serif); font-size: 1.2rem; font-weight: 300; margin-bottom: 1.25rem; }
.modal-title em { font-style: italic; color: var(--accent); }
.modal-actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1.25rem; }

/* ── TOAST ── */
#toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(.5rem); background: var(--raised); border: 1px solid var(--border2); color: var(--text); padding: .5rem 1.1rem; border-radius: 6px; font-size: .75rem; font-family: var(--mono); opacity: 0; pointer-events: none; transition: all .2s; z-index: 999; white-space: nowrap; }
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.ok  { border-color: var(--green); color: var(--green); }
#toast.err { border-color: var(--red);   color: var(--red); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="view-login">
  <div class="login-wrap">
    <div class="login-eyebrow">HM · Caderno de Obra</div>
    <h1 class="login-title">As tuas<br><em>Obras</em></h1>
    <p class="login-sub">Acesso restrito ao responsável de projecto.</p>
    <div class="f"><label>Email</label><input type="email" id="li-email" autocomplete="username" placeholder="email@leroymerlin.pt"></div>
    <div class="f"><label>Password</label><input type="password" id="li-pass" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn-login" onclick="doLogin()">Entrar</button>
    <div id="login-err"></div>
  </div>
</div>

<!-- APP -->
<div id="view-app">
  <div class="topbar">
    <span class="topbar-logo">HM · <b>Obra</b></span>
    <div class="topbar-actions">
      <span class="topbar-user" id="topbar-user"></span>
      <button class="btn btn-primary btn-sm" onclick="showModal()">＋ Nova obra</button>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Sair</button>
    </div>
  </div>

  <div class="hero">
    <h1 class="hero-title">Caderno de <em>Obra</em></h1>
    <p class="hero-sub" id="hero-sub">A carregar…</p>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search-input" placeholder="Pesquisar obra…" oninput="renderObras()">
    </div>
    <div class="filter-btns">
      <button class="filter-btn active" data-filter="todas"    onclick="setFilter('todas')">Todas</button>
      <button class="filter-btn"        data-filter="em_obra"  onclick="setFilter('em_obra')">Em obra</button>
      <button class="filter-btn"        data-filter="concluido" onclick="setFilter('concluido')">Concluídas</button>
    </div>
    <span class="obras-count" id="obras-count"></span>
  </div>

  <div class="obras-grid" id="obras-grid">
    <div class="loading-grid"><div class="spinner"></div></div>
  </div>
</div>

<!-- MODAL NOVA OBRA -->
<div class="modal-bg" id="modal-nova">
  <div class="modal">
    <div class="modal-title">Nova <em>Obra</em></div>
    <div class="f"><label>ID da obra</label><input type="text" id="nova-id" placeholder="ex: joao-silva-viseu"></div>
    <div class="f"><label>Nome / Cliente</label><input type="text" id="nova-nome" placeholder="ex: João Silva"></div>
    <div class="f"><label>Morada</label><input type="text" id="nova-morada" placeholder="Rua, Localidade"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="criarObra()">Criar e abrir editor</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { db, auth }     from './firebase.js';
import { getFirestore, collection, getDocs, doc, getDoc, setDoc }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { signInWithEmailAndPassword, signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

// ── AUTH ─────────────────────────────────────────
onAuthStateChanged(auth, u => {
  document.getElementById('view-login').style.display = u ? 'none' : 'flex';
  document.getElementById('view-app').style.display   = u ? 'flex' : 'none';
  if (u) {
    document.getElementById('topbar-user').textContent = u.email?.split('@')[0] || '';
    loadObras();
  }
});
window.doLogin = async () => {
  const e = document.getElementById('li-email').value.trim();
  const p = document.getElementById('li-pass').value;
  document.getElementById('login-err').textContent = '';
  try { await signInWithEmailAndPassword(auth, e, p); }
  catch { document.getElementById('login-err').textContent = 'Email ou password incorrectos.'; }
};
window.doLogout = () => signOut(auth);
document.getElementById('li-pass').addEventListener('keydown', ev => { if(ev.key==='Enter') window.doLogin(); });

// ── OBRAS ─────────────────────────────────────────
let allObras = [];
let activeFilter = 'todas';

async function loadObras() {
  try {
    const snap = await getDocs(collection(db, 'obras'));
    allObras = [];
    snap.forEach(d => allObras.push(d.data()));
    allObras.sort((a,b) => (b.updatedAt||b.criadoEm||'').localeCompare(a.updatedAt||a.criadoEm||''));

    document.getElementById('hero-sub').textContent =
      `${allObras.length} obra${allObras.length!==1?'s':''} registada${allObras.length!==1?'s':''}`;

    // Carregar miniaturas em paralelo
    await Promise.all(allObras.map(async o => {
      const a0 = o.alcados?.[0];
      if (!a0?.temImg) return;
      try {
        const s = await getDoc(doc(db,'obras_imagens',`${o.id}_${a0.key}`));
        if (s.exists()) o._thumb = s.data().img;
      } catch(_) {}
    }));

    renderObras();
  } catch(e) {
    document.getElementById('obras-grid').innerHTML =
      `<div class="empty-state"><div class="empty-icon">⚠️</div><div class="empty-title">Erro</div><div class="empty-sub">${e.message}</div></div>`;
  }
}

window.renderObras = function() {
  const search = document.getElementById('search-input').value.toLowerCase();
  const obras  = allObras.filter(o => {
    const mF = activeFilter==='todas' || o.estado===activeFilter || (!o.estado && activeFilter==='em_obra');
    const mS = !search || [o.nome,o.id,o.morada].some(v=>v?.toLowerCase().includes(search));
    return mF && mS;
  });

  document.getElementById('obras-count').textContent = `${obras.length} obra${obras.length!==1?'s':''}`;
  const grid = document.getElementById('obras-grid');

  if (!obras.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-icon">📋</div>
      <div class="empty-title">Sem obras</div>
      <div class="empty-sub">${search||activeFilter!=='todas'
        ? 'Nenhuma obra corresponde aos filtros.'
        : 'Cria a primeira obra clicando em "+ Nova obra".'}</div>
    </div>`;
    return;
  }

  const base = location.origin + location.pathname.replace('index.html','');
  grid.innerHTML = '';
  obras.forEach(o => {
    const estado    = o.estado || 'em_obra';
    const estadoTxt = estado==='concluido' ? 'Concluído' : 'Em obra';
    const nAlcados  = (o.alcados||[]).length;
    const nHs       = Object.values(o.hotspots||{}).reduce((s,a)=>s+a.length, 0);
    const nMat      = (o.materiais||[]).length;

    const card = document.createElement('div');
    card.className = 'obra-card';
    card.innerHTML = `
      <div class="card-thumb">
        ${o._thumb
          ? `<img src="${o._thumb}" alt="${o.nome||o.id}">`
          : `<div class="card-thumb-empty">📐</div>`}
        <div class="card-estado ${estado}">${estadoTxt}</div>
      </div>
      <div class="card-body">
        <div class="card-nome">${o.nome||o.id}</div>
        <div class="card-id">${o.id}</div>
        ${o.morada ? `<div class="card-morada">📍 ${o.morada}</div>` : ''}
        <div class="card-stats">
          <div class="card-stat"><b>${nAlcados}</b> alçados</div>
          <div class="card-stat"><b>${nHs}</b> hotspots</div>
          <div class="card-stat"><b>${nMat}</b> materiais</div>
        </div>
      </div>
      <div class="card-actions">
        <a class="card-btn primary" href="${base}editor.html?obra=${o.id}">✏️ Editor</a>
        <a class="card-btn" href="${base}obra-tecnico.html?obra=${o.id}" target="_blank">🔧 Técnico</a>
        <a class="card-btn" href="${base}obra-cliente.html?obra=${o.id}" target="_blank">👁 Cliente</a>
      </div>`;
    grid.appendChild(card);
  });
};

window.setFilter = f => {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b.dataset.filter===f));
  renderObras();
};

// ── NOVA OBRA ─────────────────────────────────────
window.showModal  = () => document.getElementById('modal-nova').classList.add('open');
window.closeModal = () => document.getElementById('modal-nova').classList.remove('open');

window.criarObra = async () => {
  const id     = document.getElementById('nova-id').value.trim().toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9\-_]/g,'');
  const nome   = document.getElementById('nova-nome').value.trim();
  const morada = document.getElementById('nova-morada').value.trim();
  if (!id)   return toast('Insere um ID','err');
  if (!nome) return toast('Insere o nome do cliente','err');
  try {
    await setDoc(doc(db,'obras',id), {
      id, nome, morada, notas:'', estado:'em_obra',
      alcados:[], hotspots:{}, materiais:[],
      biblioteca:[], tiposCustom:[], ocorrencias:[], conclusao:null,
      criadoEm: new Date().toISOString(), updatedAt: new Date().toISOString(),
    });
    const base = location.origin + location.pathname.replace('index.html','');
    location.href = `${base}editor.html?obra=${id}`;
  } catch(e) { toast('Erro: '+e.message,'err'); }
};

// ── TOAST ─────────────────────────────────────────
function toast(msg, type='') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show '+(type||'');
  clearTimeout(el._t); el._t = setTimeout(()=>el.className='', 2600);
}
</script>
</body>
</html>
